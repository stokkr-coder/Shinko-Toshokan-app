services:
  - type: web
    name: biblioteca-shinko
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /api/trpc/auth.me?batch=1&input=%7B%220%22%3A%7B%22json%22%3Anull%7D%7D
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_PROVIDER
        value: google
      - key: VITE_AUTH_PROVIDER
        value: google
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GOOGLE_ADMIN_EMAIL
        sync: false
      - key: GOOGLE_ALLOWED_EMAILS
        sync: false
      - key: EXTERNAL_CRON_SECRET
        generateValue: true
      - key: GITHUB_BACKUP_TOKEN
        sync: false
